<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PDF合并工具 - 安全、隐私、极简</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * {box-sizing: border-box;margin:0;padding:0;font-family:system-ui, "Microsoft Yahei"}
    body {padding:30px;max-width:920px;margin:0 auto;background:#f5f7fa}
    .card {background:#fff;padding:28px;border-radius:14px;box-shadow:0 2px 14px #0000000f}
    .title {font-size:24px;font-weight:600;margin-bottom:12px;color:#1a1a1a}
    /* 安全提示 */
    .safe-tip-box {
      background:#ecfdf3;
      border:1px solid #6ee7b7;
      border-radius:10px;
      padding:14px 18px;
      margin-bottom:24px;
    }
    .safe-title {
      font-size:17px;
      font-weight:600;
      color:#047857;
      margin-bottom:6px;
    }
    .safe-desc {
      font-size:15px;
      color:#065f46;
    }
    .row {margin-bottom:20px}
    label {display:block;margin-bottom:8px;font-weight:500;color:#303030;font-size:15px}
    input {width:100%;padding:11px 14px;border:1px solid #d3d6dc;border-radius:8px;font-size:15px;outline:none}
    input:focus {border-color:#4088f3;}
    /* 上传框 */
    .file-box {
      border: 2px dashed #ff7520;
      padding:36px 20px;
      text-align:center;
      border-radius:10px;
      cursor:pointer;
      margin-bottom:12px;
      background:#fff9f4;
      transition: all 0.2s;
    }
    .file-box:hover {
      border-color:#f45c00;
      background:#fff0e4;
    }
    .file-box .main-text {
      font-size:22px;
      font-weight:500;
      color:#1e1e1e;
      margin-bottom:8px;
    }
    .file-box .sub-text {
      font-size:16px;
      color:#6e6e6e;
    }
    .browser-tip{
      font-size:14px;
      color:#d97706;
      text-align:center;
      margin-bottom:24px;
    }
    .btn {padding:12px 30px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;transition:0.2s}
    .btn:disabled {background:#97a3b6;cursor:not-allowed;opacity:0.7}
    .tip {font-size:13px;color:#6b7280;margin-top:6px}
    .log-box {
      margin-top:22px;
      padding:16px;
      background:#111827;
      color:#39e986;
      border-radius:8px;
      white-space:pre-wrap;
      min-height:130px;
      font-family:Consolas,monospace;font-size:14px
    }
    .log-error{
      color:#ff5c5c;
    }
    /* 文件排序列表 */
    .file-list{
      border:1px solid #e5e7eb;
      border-radius:8px;
      padding:16px;
    }
    .file-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid #eee;
      gap:12px;
    }
    .file-item:last-child{border-bottom:none}
    .file-item.err{
      background:#fff5f5;
      color:#ff5c5c;
    }
    .file-name{flex:1}
    .operate-btn{
      padding:4px 10px;border:none;border-radius:4px;cursor:pointer;margin:0 3px
    }
    .btn-up,.btn-down{background:#eef2ff;color:#2563eb}
    .btn-del{background:#fee2e2;color:#dc2626}
    .operate-btn:disabled{opacity:0.4;cursor:not-allowed}
    /* 底部计数 */
    .count-footer {
      margin-top:18px;
      padding-top:14px;
      border-top:1px solid #eee;
      text-align:right;
      font-size:14px;
      color:#555;
    }
    .count-orange {
      color:#ff7520;
      font-weight:bold;
      font-size:16px;
    }
    /* 弹窗 */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
    }
    .modal-box{
      background:#ffffff;
      min-width:460px;
      max-width:90%;
      padding:26px 28px;
      border-radius:12px;
      box-shadow:0 8px 30px #00000026;
    }
    .modal-title{
      font-size:18px;
      font-weight:600;
      margin-bottom:16px;
    }
    .modal-content{
      font-size:15px;
      line-height:1.7;
    }
    .text-orange{
      color:#ff7520;
      font-weight:500;
    }
    .modal-footer{
      margin-top:22px;
      text-align:right;
    }
    .modal-confirm{
      padding:9px 24px;
      background:#1f2937;
      color:#fff;
      border:none;
      border-radius:7px;
      font-size:15px;
      cursor:pointer;
    }
  </style>
</head>
<body>
<div id="app" class="card">
  <h2 class="title">PDF合并</h2>
  <div class="safe-tip-box">
    <div class="safe-title">安全、隐私、极简</div>
    <div class="safe-desc">你的文件从未离开你的电脑/手机，100%本地处理，绝对安全。</div>
  </div>
  <div class="file-box" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="handleDrop">
    <div class="main-text">点击或拖拽添加多个PDF文件</div>
    <div class="sub-text">支持多选，顺序即为合并先后</div>
  </div>
  <div class="browser-tip">安卓设备请使用Edge、Chrome浏览器打开，手机自带浏览器易出现兼容异常</div>
  <input ref="fileInput" type="file" accept=".pdf" multiple hidden @change="handleSelectFile" />
  <div v-if="fileList.length > 0" class="row">
    <label>待合并文件列表（点击上下调整顺序，红色文件无法参与合并）</label>
    <div class="file-list">
      <div v-for="(item,idx) in fileList" :key="idx" class="file-item" :class="{err:!item.valid}">
        <div class="file-name">{{item.name}}（{{item.sizeStr}}）<span v-if="!item.valid">【受保护PDF，无法解析】</span></div>
        <div class="btns-group">
          <button class="operate-btn btn-up" :disabled="idx===0" @click="moveUp(idx)">上移</button>
          <button class="operate-btn btn-down" :disabled="idx === fileList.length-1" @click="moveDown(idx)">下移</button>
          <button class="operate-btn btn-del" @click="delItem(idx)">删除</button>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <label>合并后文件名称（自动加 .pdf）</label>
    <input v-model="outFileName" />
  </div>
  <div class="row">
    <button class="btn" :disabled="!canMerge" @click="mergePdf">开始合并PDF</button>
  </div>
  <div v-if="logText" class="log-box" v-html="logText"></div>
  <div class="count-footer">
    本地累计合并次数：<span class="count-orange">{{mergeCount}}</span> 次
  </div>
  <div v-if="showModal" class="modal-overlay" @click.self="showModal=false">
    <div class="modal-box">
      <div class="modal-title">合并完成！</div>
      <div class="modal-content">
        <p><span class="text-orange">合并文件已保存至浏览器默认下载目录。</span></p>
        <p style="margin-top:12px"><span class="text-orange">如需放到桌面，请手动复制/剪切文件到桌面文件夹。</span></p>
      </div>
      <div class="modal-footer">
        <button class="modal-confirm" @click="showModal=false">确定</button>
      </div>
    </div>
  </div>
</div>
<script>
const { createApp } = Vue
const { PDFDocument } = PDFLib
createApp({
  data() {
    return {
      fileList: [], // {file,name,sizeStr,pdfObj,valid}
      outFileName: '合并文档',
      logText: '',
      showModal: false,
      mergeCount: 0
    }
  },
  computed:{
    // 判断是否可以合并：列表不为空 + 所有文件valid=true
    canMerge(){
      if(this.fileList.length === 0) return false
      return this.fileList.every(item => item.valid)
    }
  },
  mounted() {
    // 读取合并计数
    const stored = localStorage.getItem('pdfMergeCount')
    this.mergeCount = stored ? parseInt(stored,10) : 0
  },
  methods: {
    // 文件大小格式化（复用分割工具）
    formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      else return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    },
    // 多选文件选择
    async handleSelectFile(e){
      const files = Array.from(e.target.files)
      await this.addFiles(files)
      e.target.value = ''
    },
    // 拖拽文件
    async handleDrop(e){
      const files = Array.from(e.dataTransfer.files).filter(f=>f.name.endsWith('.pdf'))
      await this.addFiles(files)
    },
    // 批量添加并解析PDF
    async addFiles(files){
      for(const file of files){
        const sizeStr = this.formatFileSize(file.size)
        let item = {
          file,
          name: file.name,
          sizeStr,
          pdfObj: null,
          valid: true
        }
        try{
          const buf = await file.arrayBuffer()
          const pdf = await PDFDocument.load(buf, {ignoreEncryption:true})
          item.pdfObj = pdf
        }catch(err){
          item.valid = false
          this.logText += `<br /><span class="log-error">❌ ${file.name}为受保护PDF，无法解析。</span>`
        }
        this.fileList.push(item)
      }
    },
    // 上移
    moveUp(idx){
      [this.fileList[idx - 1], this.fileList[idx]] = [this.fileList[idx], this.fileList[idx - 1]];
    },
    // 下移
    moveDown(idx){
      [this.fileList[idx], this.fileList[idx + 1]] = [this.fileList[idx + 1], this.fileList[idx]];
    },
    // 删除条目
    delItem(idx){
      this.fileList.splice(idx,1)
    },
    // 合并主逻辑【增加单文件捕获，解决DJI手册加载成功合并报错无提示】
    async mergePdf(){
      this.logText = '===== 开始合并 ====='
      if(this.fileList.length === 0){
        this.logText += `<br /><span class="log-error">❌ 未选择任何PDF文件。</span>`
        return
      }
      const invalid = this.fileList.filter(i=>!i.valid)
      if(invalid.length > 0){
        this.logText += `<br /><span class="log-error">❌ 列表包含受保护PDF，无法执行合并，请删除异常文件后重试。</span>`
        return
      }
      try{
        const mergedPdf = await PDFDocument.create()
        for(const item of this.fileList){
          // 单个文件独立捕获，解决加载正常但页面复制失败的特殊PDF
          try {
            const pages = await mergedPdf.copyPages(item.pdfObj, item.pdfObj.getPageIndices())
            pages.forEach(p=>mergedPdf.addPage(p))
            this.logText += `<br />✅ 已载入：${item.name}`
          } catch (innerErr) {
            this.logText += `<br /><span class="log-error">❌ ${item.name}文档结构特殊，本工具无法读取页面，请更换普通PDF。</span>`
            return;
          }
        }
        const outBuf = await mergedPdf.save()
        this.download(outBuf, this.outFileName + '.pdf')
        this.logText += `<br />===== 合并完成 =====`
        // 计数自增持久化
        this.mergeCount += 1
        localStorage.setItem('pdfMergeCount', String(this.mergeCount))
        this.showModal = true
      }catch(err){
        this.logText += `<br /><span class="log-error">❌ 合并失败，存在不兼容PDF文档，请更换文件重试。</span>`
      }
    },
    // 下载文件
    download(uint8, name){
      const blob = new Blob([uint8], {type:'application/pdf'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = name
      a.click()
      setTimeout(()=>{
        URL.revokeObjectURL(url)
      },100)
    }
  }
}).mount('#app')
</script>
</body>
</html>
